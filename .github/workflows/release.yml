name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to package, without the leading v"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          } else {
            $version = "${{ github.event.inputs.version }}"
          }

          if ($version -notmatch "^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$") {
            throw "Release version '$version' is not SemVer."
          }

          if ($version -match "^0\.0\.0($|[-+])") {
            throw "Velopack requires package versions to be >= 0.0.1."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test .\SsmsExtensionManager.slnx --configuration Release

      - name: Publish app
        run: >
          dotnet publish .\SsmsExtensionManager.App\SsmsExtensionManager.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:AppUpdateSourceUrl=https://github.com/${{ github.repository }}
          -p:ContinuousIntegrationBuild=true

      - name: Detect Trusted Signing configuration
        id: trusted-signing
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
        run: |
          $requiredValues = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:TRUSTED_SIGNING_ACCOUNT,
            $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE,
            $env:TRUSTED_SIGNING_ENDPOINT
          )

          $enabled = ($requiredValues | Where-Object { [string]::IsNullOrWhiteSpace($_) }).Count -eq 0
          "enabled=$($enabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Azure login for Trusted Signing
        if: steps.trusted-signing.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Trusted Signing metadata
        if: steps.trusted-signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

          @{
            Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE
            ExcludeCredentials = @(
              'ManagedIdentityCredential',
              'WorkloadIdentityCredential',
              'SharedTokenCacheCredential',
              'VisualStudioCredential',
              'VisualStudioCodeCredential',
              'AzurePowerShellCredential',
              'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content -Path .\artifacts\trusted-signing-metadata.json -Encoding utf8

      - name: Pack Velopack release with Trusted Signing
        if: steps.trusted-signing.outputs.enabled == 'true'
        run: >
          dotnet tool run vpk pack
          --packId SsmsExtensionManager
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .\artifacts\publish
          --mainExe SsmsExtensionManager.App.exe
          --packTitle "SSMS Extension Manager"
          --outputDir .\artifacts\Releases
          --channel win
          --runtime win-x64
          --azureTrustedSignFile .\artifacts\trusted-signing-metadata.json

      - name: Pack Velopack release
        if: steps.trusted-signing.outputs.enabled != 'true'
        run: >
          dotnet tool run vpk pack
          --packId SsmsExtensionManager
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .\artifacts\publish
          --mainExe SsmsExtensionManager.App.exe
          --packTitle "SSMS Extension Manager"
          --outputDir .\artifacts\Releases
          --channel win
          --runtime win-x64

      - name: Upload GitHub release
        run: >
          dotnet tool run vpk upload github
          --outputDir .\artifacts\Releases
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish true
          --merge true
          --tag v${{ steps.version.outputs.version }}
          --releaseName "SSMS Extension Manager v${{ steps.version.outputs.version }}"
