name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to package, without the leading v"
        required: true
        default: "0.1.0"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          } else {
            $version = "${{ github.event.inputs.version }}"
          }

          if ($version -notmatch "^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$") {
            throw "Release version '$version' is not SemVer."
          }

          if ($version -match "^0\.0\.0($|[-+])") {
            throw "Velopack requires package versions to be >= 0.0.1."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test .\SsmsExtensionManager.slnx --configuration Release

      - name: Publish app
        run: >
          dotnet publish .\SsmsExtensionManager.App\SsmsExtensionManager.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output .\artifacts\publish
          -p:Version=${{ steps.version.outputs.version }}
          -p:AppUpdateSourceUrl=https://github.com/${{ github.repository }}
          -p:ContinuousIntegrationBuild=true

      - name: Validate Trusted Signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_EXPECTED_SUBJECT: ${{ vars.TRUSTED_SIGNING_EXPECTED_SUBJECT }}
        run: |
          $requiredValues = [ordered]@{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            TRUSTED_SIGNING_ACCOUNT = $env:TRUSTED_SIGNING_ACCOUNT
            TRUSTED_SIGNING_CERTIFICATE_PROFILE = $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE
            TRUSTED_SIGNING_ENDPOINT = $env:TRUSTED_SIGNING_ENDPOINT
            TRUSTED_SIGNING_EXPECTED_SUBJECT = $env:TRUSTED_SIGNING_EXPECTED_SUBJECT
          }

          $missing = @(
            $requiredValues.GetEnumerator()
              | Where-Object { [string]::IsNullOrWhiteSpace($_.Value) }
              | ForEach-Object { $_.Key }
          )

          if ($missing.Count -gt 0) {
            throw "Trusted Signing is required for releases. Missing: $($missing -join ', ')."
          }

      - name: Azure login for Trusted Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Trusted Signing metadata
        shell: pwsh
        env:
          TRUSTED_SIGNING_ACCOUNT: ${{ vars.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          TRUSTED_SIGNING_ENDPOINT: ${{ vars.TRUSTED_SIGNING_ENDPOINT }}
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null

          @{
            Endpoint = $env:TRUSTED_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
            CertificateProfileName = $env:TRUSTED_SIGNING_CERTIFICATE_PROFILE
            ExcludeCredentials = @(
              'ManagedIdentityCredential',
              'WorkloadIdentityCredential',
              'SharedTokenCacheCredential',
              'VisualStudioCredential',
              'VisualStudioCodeCredential',
              'AzurePowerShellCredential',
              'AzureDeveloperCliCredential',
              'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json -Depth 3 | Set-Content -Path .\artifacts\trusted-signing-metadata.json -Encoding utf8

      - name: Pack signed Velopack release
        run: >
          dotnet tool run vpk pack
          --packId SsmsExtensionManager
          --packVersion ${{ steps.version.outputs.version }}
          --packDir .\artifacts\publish
          --mainExe SsmsExtensionManager.App.exe
          --packTitle "SSMS Extension Manager"
          --outputDir .\artifacts\Releases
          --channel win
          --runtime win-x64
          --azureTrustedSignFile .\artifacts\trusted-signing-metadata.json

      - name: Verify Authenticode signatures
        shell: pwsh
        env:
          EXPECTED_SIGNER_SUBJECT: ${{ vars.TRUSTED_SIGNING_EXPECTED_SUBJECT }}
        run: |
          function Assert-SignedFile {
            param([Parameter(Mandatory)][string] $Path)

            $signature = Get-AuthenticodeSignature -FilePath $Path
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for '$Path': $($signature.Status) $($signature.StatusMessage)"
            }

            $subject = $signature.SignerCertificate.Subject
            if (![string]::IsNullOrWhiteSpace($env:EXPECTED_SIGNER_SUBJECT) -and $subject -notlike "*$env:EXPECTED_SIGNER_SUBJECT*") {
              throw "Unexpected signer for '$Path': '$subject'. Expected subject containing '$env:EXPECTED_SIGNER_SUBJECT'."
            }

            Write-Host "Verified Authenticode signature: $Path ($subject)"
          }

          Assert-SignedFile -Path ".\artifacts\Releases\SsmsExtensionManager-win-Setup.exe"

          $extractRoot = Join-Path $env:RUNNER_TEMP "signature-check"
          if (Test-Path $extractRoot) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }

          $archives = Get-ChildItem -Path .\artifacts\Releases -File |
            Where-Object { $_.Extension -in ".zip", ".nupkg" }

          foreach ($archive in $archives) {
            $destination = Join-Path $extractRoot $archive.BaseName
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $destination

            foreach ($exe in Get-ChildItem -Path $destination -Recurse -File -Filter *.exe) {
              Assert-SignedFile -Path $exe.FullName
            }
          }

      - name: Upload GitHub release
        run: >
          dotnet tool run vpk upload github
          --outputDir .\artifacts\Releases
          --repoUrl https://github.com/${{ github.repository }}
          --token "${{ secrets.GITHUB_TOKEN }}"
          --publish true
          --merge true
          --tag v${{ steps.version.outputs.version }}
          --releaseName "SSMS Extension Manager v${{ steps.version.outputs.version }}"
